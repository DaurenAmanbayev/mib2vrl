[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rules2vrl"
version = "1.0.0"
description = "Convert Netcool probe rules files into Vector.dev VRL transforms"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
rules2vrl = "rules2vrl.cli:app"
