[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mib2vrl"
version = "0.1.0"
description = "Convert SNMP MIB files and Netcool probe rules into Vector.dev VRL transforms"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "typer>=0.9",
    "pyyaml>=6.0",
]

[project.scripts]
mib2vrl = "mib2vrl.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
