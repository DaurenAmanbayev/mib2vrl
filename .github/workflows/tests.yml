name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.package }} · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [mib2vrl, rules2vrl]
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=${{ matrix.package }} --cov-report=term-missing --cov-report=xml

      - name: Publish coverage to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Coverage — ${{ matrix.package }} · py${{ matrix.python-version }}"
            echo '```'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}-py${{ matrix.python-version }}
          path: ${{ matrix.package }}/coverage.xml
          if-no-files-found: ignore
